<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SFP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/" href="image/SFPLogoNoBackground.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

<div id="layout">

    <div id="sidebar">

        <div class="sidebar-top" style="display: flex; justify-content: space-between; align-items: center; padding: 4px 8px;">
            <strong id="homePress" style="display: flex; align-items: center;">
                <img src="image/SFPLogoNoBackground.png" style="width: 20px; margin-right: 4px;">
                SimpleFastPost
            </strong>
            <span id="helpBtn" class="help-icon" style="cursor: pointer;">?</span>
        </div>

        <div class="sidebar-header">
            <strong>Projects</strong>
            <button id="toggleSidebar" class="btn btn-sm btn-secondary" style="display: none">☰</button>
        </div>

        <div class="sidebar-content">
            <table class="table table-sm mb-0">
                <thead>
                <tr>

                </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="button-row">
            <button id="addFolder" class="addFolderButton">+ folder</button>
            <button id="addCommand" class="addRootCommandButton">+ Command</button>
        </div>
    </div>

    <div id="resizer"></div>


    <div id="main">


        <div id="startPage">
            <div>
                <img src="image/SFPLogoNoBackground.png" style="width: 200px">
            </div>
            <div class="startPageContent">
                <h1 style="color: white;">Welcome to SFP</h1>
                <p style="color: #bababa;">With SimpleFastPost you can simply run specified folders of commands and single commands from the terminal</p>

                <p>Checkout the repository</p>
                <a href="https://github.com/nikholt1/SimpleFastPost" target="_blank">
                    <button class="addFolderButton" style="width: 200px;">Github repo</button>
                </a>
            </div>
        </div>
    </div>
    <form class="hidden" id="commandForm">
        <h5>Add Command</h5>
        <input type="text" placeholder="Command Name" required>
        <input type="text" placeholder="Command" required>
        <input type="text" placeholder="Command Body" required>
        <button class="btn btn-primary">Add Command</button>
    </form>


    <form class="hidden" id="folderForm">
        <h5>Add Folder</h5>
        <input type="text" placeholder="Folder Name" required>
        <button class="btn btn-primary">Add Folder</button>
    </form>

</div>

<script src="app.js"></script>

</body>
</html>
